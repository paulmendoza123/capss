{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="error-wrap">
  <div class="error-card" role="alert">
    <div class="error-code">{{ code }}</div>
    <h1 class="error-title">{{ title }}</h1>
    <p class="error-msg">{{ message }}</p>
    <div class="error-actions">
      <a class="btn btn-primary" href="{{ home_url }}">{% if session.get('user_id') %}Back to my dashboard{% else %}Back to sign in{% endif %}</a>
      <button type="button" class="btn btn-ghost" onclick="history.length > 1 ? history.back() : (location.href='{{ home_url }}')">Go back</button>
    </div>
  </div>
</div>
{% endblock %}
