<!-- Change Password (shared by the teacher & student profile pages).
   Expects: pw_endpoint, user, form, errors. -->
<div class="card">
  <div class="card-title mb-2">Change Password</div>
  <form method="POST" action="{{ url_for(pw_endpoint) }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <!-- Lets the browser's password manager know which saved login this form is for
         (instead of asking you to pick one). Invisible, not submitted data. -->
    <input type="text" name="username" value="{{ user.email }}" autocomplete="username" readonly tabindex="-1" aria-hidden="true"
           style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0" />
    <div class="form-group">
      <label class="form-label">Current Password</label>
      <div class="password-input-wrap">
        <input type="password" id="current_password" name="current_password" autocomplete="current-password" class="form-control{% if errors.get('current_password') %} is-invalid{% endif %}" value="{{ form.get('current_password', '') }}" required />
        <button type="button" class="password-toggle-btn" data-target="current_password" aria-label="Show password">
          <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a20.3 20.3 0 0 1 5.06-6.06M9.9 4.24A10.4 10.4 0 0 1 12 4c7 0 11 8 11 8a20.3 20.3 0 0 1-3.22 4.44M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>
        </button>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">New Password</label>
      <div class="password-input-wrap">
        <input type="password" id="new_password" name="new_password" autocomplete="new-password" class="form-control{% if errors.get('new_password') %} is-invalid{% endif %}" value="{{ form.get('new_password', '') }}" required />
        <button type="button" class="password-toggle-btn" data-target="new_password" aria-label="Show password">
          <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a20.3 20.3 0 0 1 5.06-6.06M9.9 4.24A10.4 10.4 0 0 1 12 4c7 0 11 8 11 8a20.3 20.3 0 0 1-3.22 4.44M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>
        </button>
      </div>
      <div class="pw-requirements" data-target="new_password"{% if errors.get('new_password') %} data-show-failed="1"{% endif %}>
        <div class="pw-req-title">Your password must contain:</div>
        <div class="pw-req-item" data-rule="length">
          <div class="pw-req-item-row"><span class="pw-req-icon"></span> At least 8 characters</div>
        </div>
        <div class="pw-req-item" data-rule="special">
          <div class="pw-req-item-row"><span class="pw-req-icon"></span> At least 1 special character (e.g. !@#$%^&amp;*)</div>
        </div>
        <div class="pw-req-item" data-rule="variety">
          <div class="pw-req-item-row"><span class="pw-req-icon"></span> At least 3 of the following:</div>
          <div class="pw-req-subitems">
            <div class="pw-req-subitem" data-rule="lower"><span class="pw-req-icon"></span> Lower case letters (a-z)</div>
            <div class="pw-req-subitem" data-rule="upper"><span class="pw-req-icon"></span> Upper case letters (A-Z)</div>
            <div class="pw-req-subitem" data-rule="number"><span class="pw-req-icon"></span> Numbers (0-9)</div>
          </div>
        </div>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Confirm New Password</label>
      <div class="password-input-wrap">
        <input type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" class="form-control{% if errors.get('confirm_password') %} is-invalid{% endif %}" value="{{ form.get('confirm_password', '') }}" required data-confirm-target="new_password" />
        <button type="button" class="password-toggle-btn" data-target="confirm_password" aria-label="Show password">
          <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a20.3 20.3 0 0 1 5.06-6.06M9.9 4.24A10.4 10.4 0 0 1 12 4c7 0 11 8 11 8a20.3 20.3 0 0 1-3.22 4.44M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>
        </button>
      </div>
      <div class="password-mismatch-msg{% if errors.get('confirm_password') and form.get('new_password') != form.get('confirm_password') %} is-visible{% endif %}">Passwords do not match.</div>
    </div>
    <button type="submit" class="btn btn-primary btn-sm">Update Password</button>
  </form>
</div>
