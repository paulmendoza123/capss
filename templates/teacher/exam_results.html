{% extends 'base.html' %}
{% block title %}Results — {{ exam.title }}{% endblock %}
{% block content %}
<div class="page-header">
  <div>
    <div class="page-title">{{ exam.title }}</div>
    <div class="page-subtitle">{{ exam.subject_name }} · {{ exam.block_name }}</div>
  </div>
  <div class="page-actions">
    <a href="{{ url_for('teacher_exam_monitoring', exam_id=exam.id) }}" class="btn btn-ghost"><svg class="icon" aria-hidden="true"><use href="#i-eye"/></svg> Live Monitoring</a>
    <a href="{{ url_for('teacher_class_detail', class_id=exam.class_id) }}" class="btn btn-ghost">← Back to Class</a>
  </div>
</div>

<!-- Summary stats — filled in by JS -->
<div class="stat-cards mb-3" style="margin-bottom:1.25rem;">
  <div class="stat-card">
    <div class="stat-label">Total</div>
    <div class="stat-value blue" id="res-total">—</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Ongoing</div>
    <div class="stat-value orange" id="res-ongoing">—</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Passed</div>
    <div class="stat-value green" id="res-passed">—</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Failed</div>
    <div class="stat-value red" id="res-failed">—</div>
  </div>
</div>

<!-- Results table — filled in by JS -->
<div id="results-container">
  <div class="empty-state" id="results-loading">
    <div class="empty-state-icon">⏳</div>
    <div class="empty-state-title">Loading results…</div>
  </div>
</div>

<!-- Question analysis — filled in by JS -->
<div id="question-stats-container"></div>

<script>
const EXAM_ID = {{ exam.id }};
const EXAM_TITLE = {{ exam.title | tojson }};
let lastResultsData = null;
let lastResultsJson = '';
let lastQStatsJson = '';
let resultsSortKey = 'default';

function esc(v) {
  return String(v ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// Display only: 'YYYY-MM-DD HH:MM[:SS]' -> 12-hour time with AM/PM.
function fmtTime12(v) {
  if (typeof v !== 'string') return v;
  const m = v.trim().match(/^(\d{4}-\d{2}-\d{2})[ T](\d{1,2}):(\d{2})(?::(\d{2}))?/);
  if (!m) return v;
  const h = parseInt(m[2], 10);
  return `${m[1]} ${h % 12 || 12}:${m[3]}${m[4] ? ':' + m[4] : ''} ${h >= 12 ? 'PM' : 'AM'}`;
}

function getResultStatusLabel(r, passPct) {
  if (r.status === 'terminated') return 'Terminated';
  if (r.status === 'ongoing') return 'Ongoing';
  if (r.pct !== null && r.pct >= passPct) return 'Passed';
  return 'Failed';
}

function sortResults(results, passPct) {
  const sorted = results.slice();
  const byPct = dir => (a, b) => {
    if (a.pct === null && b.pct === null) return 0;
    if (a.pct === null) return 1;   // no score yet (ongoing) sinks to the bottom
    if (b.pct === null) return -1;
    return dir * (a.pct - b.pct);
  };
  switch (resultsSortKey) {
    case 'name_asc':  sorted.sort((a, b) => (a.full_name || '').localeCompare(b.full_name || '')); break;
    case 'name_desc': sorted.sort((a, b) => (b.full_name || '').localeCompare(a.full_name || '')); break;
    case 'score_high': sorted.sort(byPct(-1)); break;
    case 'score_low':  sorted.sort(byPct(1)); break;
    case 'status': {
      const rank = { 'Ongoing': 0, 'Passed': 1, 'Failed': 2, 'Terminated': 3 };
      sorted.sort((a, b) => rank[getResultStatusLabel(a, passPct)] - rank[getResultStatusLabel(b, passPct)]);
      break;
    }
    case 'submitted_new': sorted.sort((a, b) => (b.submitted_at || '').localeCompare(a.submitted_at || '')); break;
    case 'submitted_old': sorted.sort((a, b) => (a.submitted_at || '').localeCompare(b.submitted_at || '')); break;
    default:
      // Order of entry: first student to enter the exam at the top.
      sorted.sort((a, b) => {
        if (!a.started_at && !b.started_at) return 0;
        if (!a.started_at) return 1;
        if (!b.started_at) return -1;
        return String(a.started_at).localeCompare(String(b.started_at));
      });
  }
  return sorted;
}

const RESULTS_SORT_OPTIONS = [
  ['default', 'Default'],
  ['name_asc', 'Name (A–Z)'],
  ['name_desc', 'Name (Z–A)'],
  ['score_high', 'Score (High–Low)'],
  ['score_low', 'Score (Low–High)'],
  ['status', 'Status'],
  ['submitted_new', 'Submitted (Newest)'],
  ['submitted_old', 'Submitted (Oldest)'],
];

function onResultsSortChange(value) {
  resultsSortKey = value;
  renderResultsTable();
}

function renderResultsTable() {
  const data = lastResultsData;
  const container = document.getElementById('results-container');
  if (!data || !container) return;

  const results = data.results || [];
  const passPct = data.passing_score ?? 75;

  if (results.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon"><svg class="icon" aria-hidden="true"><use href="#i-chart"/></svg></div>
        <div class="empty-state-title">No submissions yet</div>
        <div class="empty-state-text">Results will appear here once students submit the exam.</div>
      </div>`;
    return;
  }

  const rows = sortResults(results, passPct).map(r => {
    const scoreCell = r.status === 'ongoing'
      ? '<span class="text-muted text-sm">In progress…</span>'
      : r.score !== null && r.total_points ? `${parseInt(r.score)} / ${r.total_points}` : '—';
    const pctCell = r.status === 'ongoing'
      ? '—'
      : r.pct !== null
        ? `<span class="fw-600 ${r.pct >= passPct ? 'text-success' : 'text-danger'}">${r.pct}%</span>` : '—';
    let statusBadge;
    if (r.status === 'terminated') statusBadge = '<span class="badge badge-red">Terminated</span>';
    else if (r.status === 'ongoing') statusBadge = '<span class="badge badge-yellow">● Ongoing</span>';
    else if (r.pct !== null && r.pct >= passPct) statusBadge = '<span class="badge badge-green">Passed</span>';
    else statusBadge = '<span class="badge badge-red">Failed</span>';
    const actionCell = (r.status === 'submitted' || r.status === 'terminated')
      ? `<a href="/teacher/exam/${EXAM_ID}/student/${r.student_id}/result" class="btn btn-ghost btn-sm"><svg class="icon" aria-hidden="true"><use href="#i-eye"/></svg> View Results</a>`
      : '<span class="text-muted text-sm">—</span>';
    return `<tr>
      <td class="fw-600">${esc(r.full_name)}</td>
      <td>${scoreCell}</td>
      <td>${pctCell}</td>
      <td>${statusBadge}</td>
      <td class="text-sm text-muted">${fmtTime12(r.started_at) || '—'}</td>
      <td class="text-sm text-muted">${fmtTime12(r.submitted_at) || '—'}</td>
      <td>${actionCell}</td>
    </tr>`;
  }).join('');

  const sortOptionsHtml = RESULTS_SORT_OPTIONS.map(([val, label]) =>
    `<option value="${val}" ${resultsSortKey === val ? 'selected' : ''}>${label}</option>`).join('');

  const prevScroll = container.querySelector('.table-scroll-10')?.scrollTop || 0;
  container.innerHTML = `
    <div style="display:flex;gap:0.5rem;justify-content:flex-end;align-items:center;margin-bottom:0.75rem;flex-wrap:wrap;">
      <label for="results-sort" class="text-sm text-muted">Sort by:</label>
      <select id="results-sort" class="form-select" style="max-width:190px;padding:0.4rem 0.75rem;font-size:0.85rem"
              onchange="onResultsSortChange(this.value)">${sortOptionsHtml}</select>
      <button onclick="generateResultsReport()" class="btn btn-primary" style="font-size:0.85rem"><svg class="icon" aria-hidden="true"><use href="#i-file"/></svg> Export CSV</button>
    </div>
    <div class="card" style="padding:0">
      <div class="table-wrap table-scroll-10">
        <table>
          <thead><tr><th>Student</th><th>Score</th><th>Percentage</th><th>Status</th><th>Start Time</th><th>Submitted</th><th>Actions</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;
  const newWrap = container.querySelector('.table-scroll-10');
  if (newWrap) newWrap.scrollTop = prevScroll;
}

const QUESTION_TYPE_META = {
  multiple_choice: ['Multiple Choice', 'badge-blue'],
  true_false:      ['True / False', 'badge-green'],
  short_answer:    ['Short Answer', 'badge-orange'],
  fill_blank:      ['Fill in the Blank', 'badge-yellow'],
  essay:           ['Essay', 'badge-purple']
};
function questionTypeBadge(type) {
  const m = QUESTION_TYPE_META[type] || [type || '\u2014', 'badge-gray'];
  return `<span class="badge ${m[1]}" style="white-space:nowrap">${m[0]}</span>`;
}

function updateResults(data) {
  lastResultsData = data;
  const results = data.results || [];
  const passPct = data.passing_score ?? 75;
  const totalSubmitted = data.total_submitted || 0;
  const questionStats = data.question_stats || [];

  const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
  set('res-total', results.length);
  set('res-passed', results.filter(r => r.pct !== null && r.pct >= passPct && r.status === 'submitted').length);
  set('res-failed', results.filter(r => r.status === 'submitted' && (r.pct === null || r.pct < passPct)).length);
  set('res-ongoing', results.filter(r => r.status === 'ongoing').length);

  const resultsJson = JSON.stringify(results) + '|' + passPct;
  if (resultsJson !== lastResultsJson) {
    lastResultsJson = resultsJson;
    renderResultsTable();
  }

  const qContainer = document.getElementById('question-stats-container');
  const qJson = JSON.stringify(questionStats) + '|' + totalSubmitted + '|' + passPct;
  if (qContainer && qJson !== lastQStatsJson) {
    lastQStatsJson = qJson;
    const prevQScroll = qContainer.querySelector('.table-scroll-10')?.scrollTop || 0;
    if (questionStats.length > 0 && totalSubmitted > 0) {
      const qRows = questionStats.map(qs => {
        const barColor = qs.pct >= passPct ? 'var(--accent2)' : qs.pct >= 40 ? '#f7c94f' : 'var(--danger)';
        const labelClass = qs.pct >= passPct ? 'text-success' : qs.pct >= 40 ? 'text-accent' : 'text-danger';
        return `<tr>
          <td class="font-mono text-xs text-muted">${qs.number}</td>
          <td style="max-width:320px">${esc(qs.question_text)}</td>
          <td class="text-sm">${questionTypeBadge(qs.question_type)}</td>
          <td class="text-sm text-muted">${esc(qs.section_title) || '—'}</td>
          <td class="font-mono text-sm">${qs.correct_count} / ${qs.total}</td>
          <td style="min-width:140px">
            <div style="display:flex;align-items:center;gap:0.5rem">
              <div style="flex:1;background:var(--border);border-radius:99px;height:8px;overflow:hidden">
                <div style="height:100%;border-radius:99px;width:${qs.pct}%;background:${barColor}"></div>
              </div>
              <span class="text-sm fw-600 ${labelClass}">${qs.pct}%</span>
            </div>
          </td>
        </tr>`;
      }).join('');
      qContainer.innerHTML = `
        <div class="card mt-3" style="padding:0;overflow:visible">
          <div style="padding:1.25rem 1.25rem 0.75rem">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:0.75rem;flex-wrap:wrap">
              <div class="card-title mb-1">Question Analysis</div>
              <button onclick="exportQuestionAnalysis()" class="btn btn-primary" style="font-size:0.85rem"><svg class="icon" aria-hidden="true"><use href="#i-file"/></svg> Export CSV</button>
            </div>
            <div class="text-sm text-muted mb-2">Sorted by most answered correctly — based on ${totalSubmitted} submission(s). Essays are excluded (graded manually). A student counts as correct only if the whole answer is right.</div>
          </div>
          <div class="table-wrap table-scroll-10">
            <table style="min-width:600px">
              <thead><tr><th>#</th><th>Question</th><th>Type</th><th>Section</th><th>Correct</th><th>Rate</th></tr></thead>
              <tbody>${qRows}</tbody>
            </table>
          </div>
        </div>`;
    } else {
      qContainer.innerHTML = '';
    }
    const qWrap = qContainer.querySelector('.table-scroll-10');
    if (qWrap) qWrap.scrollTop = prevQScroll;
  }
}

async function loadResults() {
  try {
    const res = await fetch(`/api/results/${EXAM_ID}`);
    if (!res.ok) throw new Error('bad response');
    updateResults(await res.json());
  } catch (e) {
    const c = document.getElementById('results-container');
    if (c && !lastResultsData) {
      c.innerHTML = `<div class="empty-state"><div class="empty-state-title">Could not load results</div>
        <div class="empty-state-text">Please refresh the page.</div></div>`;
    }
  }
}
loadResults();
setInterval(loadResults, 5000);

function generateResultsReport() {
  const passPct = lastResultsData?.passing_score ?? 75;
  const results = ((lastResultsData && lastResultsData.results) || []).slice().sort((a, b) =>
    (a.last_name || '').localeCompare(b.last_name || '', undefined, { sensitivity: 'base' }) ||
    (a.first_name || '').localeCompare(b.first_name || '', undefined, { sensitivity: 'base' }));
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const csvHeader = ['First Name', 'Last Name', 'Score', 'Percentage', 'Status', 'Start Time', 'Submitted'];
  const csvRows = results.map(r => {
    const score = r.score !== null && r.total_points ? `${parseInt(r.score)}` : '—';
    const pct = r.pct !== null ? `${r.pct}%` : '—';
    let status;
    if (r.status === 'terminated') status = 'Terminated';
    else if (r.status === 'ongoing') status = 'Ongoing';
    else if (r.pct !== null && r.pct >= passPct) status = 'Passed';
    else status = 'Failed';
    return [q(r.first_name), q(r.last_name), q(score), q(pct), q(status), q(fmtTime12(r.started_at) || '—'), q(fmtTime12(r.submitted_at) || '—')].join(',');
  });
  const blob = new Blob([[csvHeader.join(','), ...csvRows].join('\n')], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${EXAM_TITLE.replace(/\s+/g, '_')}_Results.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

// Question Analysis -> CSV (same rows/order as the table on screen).
function exportQuestionAnalysis() {
  const stats = (lastResultsData && lastResultsData.question_stats) || [];
  if (!stats.length) return;
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const typeLabel = t => (QUESTION_TYPE_META[t] ? QUESTION_TYPE_META[t][0] : (t || ''));
  const header = ['#', 'Question', 'Type', 'Section', 'Correct', 'Incorrect', 'Total Submissions', 'Correct Rate (%)'];
  const rows = stats.map(s => [
    q(s.number), q(s.question_text), q(typeLabel(s.question_type)), q(s.section_title || ''),
    q(s.correct_count), q(s.total - s.correct_count), q(s.total), q(s.pct)
  ].join(','));
  // BOM so Excel reads accented / special characters correctly
  const blob = new Blob(['\uFEFF' + [header.join(','), ...rows].join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${EXAM_TITLE.replace(/\s+/g, '_')}_Question_Analysis.csv`;
  a.click();
  URL.revokeObjectURL(url);
}
</script>
{% endblock %}
