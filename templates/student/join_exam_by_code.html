{% extends 'base.html' %}
{% block title %}Join Exam by Code{% endblock %}
{% block content %}
<div class="page-header">
  <div>
    <div class="page-title">Join Exam by Code</div>
    <div class="page-subtitle">Enter the code your teacher gave you</div>
  </div>
  <a href="{{ url_for('student_exams') }}" class="btn btn-ghost">← Back to Exams</a>
</div>

<div class="card" style="max-width:420px;margin:2rem auto;">
  <div style="text-align:center;margin-bottom:1.5rem">
    <div style="font-size:3rem;margin-bottom:0.5rem"><svg class="icon" aria-hidden="true"><use href="#i-key"/></svg></div>
    <div class="fw-700" style="font-size:1.1rem">Exam Access Code</div>
    <div class="text-muted text-sm" style="margin-top:0.25rem">Ask your teacher for the 6-character code</div>
  </div>

  <form method="POST" action="{{ url_for('student_join_exam_by_code') }}">
    <div class="form-group">
      <label class="form-label">Exam Code</label>
      <input
        type="text"
        name="exam_code"
        class="form-control"
        placeholder="e.g. A3BX9K"
        maxlength="6"
        autocomplete="off"
        autofocus
        style="text-transform:uppercase;letter-spacing:0.25em;font-size:1.35rem;text-align:center;font-weight:700"
        oninput="this.value=this.value.toUpperCase()"
        required
      />
      <div class="form-hint" style="text-align:center">6-character code — letters and numbers</div>
    </div>
    <button type="submit" class="btn btn-primary" style="width:100%;margin-top:0.5rem">
      Enter Exam →
    </button>
  </form>
</div>
{% endblock %}
