{% extends 'base.html' %}
{% block title %}Sign Up{% endblock %}
{% block head %}
<style>
  html, html[data-theme="dark"] {
    --bg: #f0f2f7; --bg2: #ffffff; --bg3: #e8ebf2;
    --border: #d4d8e8; --border2: #b8bed4;
    --accent: #3b7de8; --accent2: #1db885; --accent3: #e07c30;
    --danger: #e04545; --warning: #d4a017;
    --text: #1a1d2e; --text2: #4a5068; --text3: #8890aa;
    --card: #ffffff; --card2: #f5f7fc;
    --shadow: 0 4px 24px rgba(0,0,0,0.08);
    --shadow-lg: 0 8px 48px rgba(0,0,0,0.14);
  }
  .theme-toggle-btn { display: none !important; }
</style>
{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card" style="max-width:480px">
    <div class="auth-logo">
      <div class="auth-logo-icon">⚡</div>
      <div>
        <div class="auth-logo-text">SPARK</div>
        <div class="text-xs text-muted font-mono" style="letter-spacing:0.12em">EXAM SYSTEM</div>
      </div>
    </div>

    <div class="auth-title">Create an account</div>
    <div class="auth-sub">Register as a student to join classes and take exams.</div>

    <form method="POST">
      <div class="form-group">
        <label class="form-label">Full Name</label>
        <input type="text" name="full_name" class="form-control" placeholder="Juan dela Cruz" required />
      </div>
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" name="email" class="form-control" placeholder="you@school.edu" required />
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="password-input-wrap">
          <input type="password" name="password" id="signup-password" class="form-control" placeholder="Minimum 6 characters" required minlength="6" />
          <button type="button" class="password-toggle-btn" data-target="signup-password" aria-label="Show password">
            <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a20.3 20.3 0 0 1 5.06-6.06M9.9 4.24A10.4 10.4 0 0 1 12 4c7 0 11 8 11 8a20.3 20.3 0 0 1-3.22 4.44M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>
          </button>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Confirm Password</label>
        <div class="password-input-wrap">
          <input type="password" name="confirm_password" id="signup-confirm-password" class="form-control" placeholder="Re-enter your password" required minlength="6" data-confirm-target="signup-password" />
          <button type="button" class="password-toggle-btn" data-target="signup-confirm-password" aria-label="Show password">
            <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a20.3 20.3 0 0 1 5.06-6.06M9.9 4.24A10.4 10.4 0 0 1 12 4c7 0 11 8 11 8a20.3 20.3 0 0 1-3.22 4.44M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>
          </button>
        </div>
        <div class="password-mismatch-msg">Passwords do not match.</div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Program</label>
          <select name="program" class="form-select" required>
            <option value="">Select Program</option>
            {% for p in programs %}
            <option value="{{ p.code }}">{{ p.code }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Year Level</label>
          <select name="year_level" class="form-select" required>
            <option value="">Select Year</option>
            <option value="1st Year">1st Year</option>
            <option value="2nd Year">2nd Year</option>
            <option value="3rd Year">3rd Year</option>
            <option value="4th Year">4th Year</option>
          </select>
        </div>
      </div>
      <button type="submit" class="btn btn-success btn-block btn-lg" style="margin-top:0.5rem">
        Create Account →
      </button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="{{ url_for('login') }}">Sign in</a>
    </div>
  </div>
</div>
{% endblock %}
