{% extends 'base.html' %}
{% block title %}Create User{% endblock %}
{% block topbar_title %}Create User{% endblock %}
{% block content %}
<div class="page-header">
  <div class="page-title">Create New User</div>
  <a href="{{ url_for('admin_users') }}" class="btn btn-ghost">← Back</a>
</div>

<div class="card" style="max-width:520px">
  <form method="POST">
    <div class="form-group">
      <label class="form-label">Full Name</label>
      <input type="text" name="full_name" class="form-control" placeholder="Juan dela Cruz" required />
    </div>
    <div class="form-group">
      <label class="form-label">Email Address</label>
      <input type="email" name="email" class="form-control" placeholder="user@school.edu" required />
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input type="password" name="password" class="form-control" placeholder="Minimum 6 characters" required minlength="6" />
    </div>
    <div class="form-group">
      <label class="form-label">Role</label>
      <select name="role" class="form-select" id="role-select" required>
        <option value="">Select Role</option>
        <option value="teacher">Teacher</option>
        <option value="student">Student</option>
        <option value="admin">Admin</option>
      </select>
    </div>
    <div id="student-fields" style="display:none">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Program</label>
          <select name="program" class="form-select">
            <option value="">Select Program</option>
            {% for p in programs %}
            <option value="{{ p.code }}">{{ p.code }} — {{ p.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Year Level</label>
          <select name="year_level" class="form-select">
            <option value="">Select Year</option>
            <option>1st Year</option>
            <option>2nd Year</option>
            <option>3rd Year</option>
            <option>4th Year</option>
          </select>
        </div>
      </div>
    </div>
    <button type="submit" class="btn btn-primary btn-block">Create Account</button>
  </form>
</div>

<script>
  document.getElementById('role-select').addEventListener('change', function () {
    document.getElementById('student-fields').style.display =
      this.value === 'student' ? 'block' : 'none';
  });
</script>
{% endblock %}
