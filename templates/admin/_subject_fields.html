{% set s = subj if subj is defined else none %}
<div class="form-row">
  <div class="form-group">
    <label class="form-label">Program</label>
    <select name="program" class="form-select" required>
      {% if not s %}<option value="">Select program</option>{% endif %}
      {% for p in programs %}<option value="{{ p }}" {% if s and s.program == p %}selected{% endif %}>{{ p }}</option>{% endfor %}
      {% if s and s.program not in programs %}<option value="{{ s.program }}" selected>{{ s.program }} (not in Programs)</option>{% endif %}
    </select>
  </div>
  <div class="form-group">
    <label class="form-label">Year Level</label>
    <select name="year_level" class="form-select" required>
      {% for y in year_levels %}<option value="{{ y }}" {% if s and s.year_level == y %}selected{% endif %}>{{ y }}</option>{% endfor %}
    </select>
  </div>
</div>
<div class="form-row">
  <div class="form-group">
    <label class="form-label">Prospectus Semester</label>
    <select name="term" class="form-select" required>
      {% for t in terms %}<option value="{{ t }}" {% if s and s.term == t %}selected{% endif %}>{{ t }}</option>{% endfor %}
    </select>
  </div>
  <div class="form-group">
    <label class="form-label">Course Code</label>
    <input type="text" name="code" class="form-control" value="{{ s.code if s else '' }}" maxlength="20" required />
  </div>
</div>
<div class="form-group">
  <label class="form-label">Course Title</label>
  <input type="text" name="title" class="form-control" value="{{ s.title if s else '' }}" maxlength="200" required />
</div>
<div class="form-row">
  <div class="form-group">
    <label class="form-label">Units (Lec/Lab)</label>
    <input type="text" name="units_text" class="form-control" placeholder="2/1" value="{{ s.units_text if s and s.units_text else '' }}" maxlength="10" />
  </div>
  <div class="form-group">
    <label class="form-label">Total Units</label>
    <input type="text" name="total_units" class="form-control" placeholder="3" value="{{ s.total_units|units if s else '' }}" maxlength="5" />
  </div>
</div>
<div class="form-group">
  <label class="form-label">Pre-requisite</label>
  <input type="text" name="prerequisite" class="form-control" value="{{ s.prerequisite if s and s.prerequisite else '' }}" maxlength="200" />
</div>
